<header class="site-header">
  <a class="brand" href="index.html">c.odo</a>

  <nav aria-label="Main"><ul class="nav-list"><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="projects.html">Projects</a></li><li><a href="planner.html">Planner</a></li><li><a href="contact.html" class="active" aria-current="page">Contact</a></li></ul></nav>
</header>
<main>
<section class="section narrow">
  <h1>Contact me</h1>
  <form id="contactForm" novalidate>
    <div class="field"><label for="name">Name</label><input type="text" id="name" name="name" autocomplete="name"><span class="error" id="nameError"></span></div>
    <div class="field"><label for="email">Email address</label><input type="email" id="email" name="email" autocomplete="email"><span class="error" id="emailError"></span></div>
    <div class="field"><label for="phone">Phone number</label><input type="tel" id="phone" name="phone" autocomplete="tel"><span class="error" id="phoneError"></span></div>
    <div class="field"><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><span class="error" id="messageError"></span></div>
    <button class="btn" type="submit">Send message</button>
    <p id="formSuccess" class="success" role="status"></p>
  </form>
</section>
</main>
